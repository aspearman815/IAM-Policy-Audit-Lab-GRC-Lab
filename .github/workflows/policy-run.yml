name: Conftest Policy Check

on:
  push:
    paths:
      - '**/*.json'
      - '**/*.rego'
  pull_request:

jobs:
  conftest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.62.0/conftest_0.62.0_Linux_x86_64.tar.gz
          tar -xzf conftest_0.62.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Run Conftest
        run: |
          conftest test bad-policy.json --policy .
